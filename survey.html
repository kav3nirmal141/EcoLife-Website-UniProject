<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eco Survey</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Eco Action Survey 📊</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="sustainability.html">Sustainability</a>
    <a href="tips.html">Eco Tips</a>
    <a href="recycling.html">Recycling Guide</a>
    <a href="survey.html">Eco Survey</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <div class="survey-box">
        <h2>Tell us your Eco Habits</h2>
        <p>Your answers helps others to improve too</p>
    </div>

    <form>
        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br>

        <label>Do you recycle?</label><br>
        <input type="radio" name="recycle"> Yes
        <input type="radio" name="recycle"> No
        <br><br>

        <label>Select your eco-friendly habits:</label><br>
        <input type="checkbox"> Save water<br>
        <input type="checkbox"> Reduce plastic<br>
        <input type="checkbox"> Use reusable bags<br>
        <input type="checkbox"> Turn off lights when not needed<br>
        <input type="checkbox"> Walk or cycle<br><br>

        <label>Additional Suggestions:</label><br>
        <textarea rows="4" placeholder="Share your ideas..."></textarea><br>

        <button class="submit-btn">Submit</button>
    </form>

</div>

<footer>
    2025 EcoLife | Our Project
</footer>

</body>
</html>
